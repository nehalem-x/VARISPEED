<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VARISPEED · Visualização de áudio</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" type="image/x-icon" href="assets/varispeed.ico" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<style>
  /* apenas o osciloscópio: nenhuma timeline, nenhum controle */
  .win { position: fixed; inset: 0; background: var(--bg); }
  .win__scope { display: block; width: 100%; height: 100%; }
  .win__note {
    position: fixed;
    inset: auto 0 0 0;
    padding: var(--space-3) var(--space-4);
    font-size: var(--text-xs);
    color: var(--text-3);
    text-align: center;
  }
</style>
</head>
<body>
<div class="win">
  <canvas class="win__scope" id="scopeWin"></canvas>
</div>
<p class="win__note" id="winNote" hidden>Sem conexão com a sessão do VARISPEED.</p>
<script src="core.js"></script>
<script src="scope-view.js"></script>
<script src="scope-win.js"></script>
</body>
</html>
