<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VARISPEED — Visualização de áudio</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M6 22V10M12 26V6M18 19V13M24 24V8' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E" />
<style>
  /* apenas o osciloscópio: nenhuma timeline, nenhum controle */
  .win { position: fixed; inset: 0; background: var(--bg); }
  .win__scope { display: block; width: 100%; height: 100%; }
  .win__note {
    position: fixed;
    inset: auto 0 0 0;
    padding: var(--space-3) var(--space-4);
    font-size: var(--text-xs);
    color: var(--text-3);
    text-align: center;
  }
</style>
</head>
<body>
<div class="win">
  <canvas class="win__scope" id="scopeWin"></canvas>
</div>
<p class="win__note" id="winNote" hidden>Sem conexão com a sessão do VARISPEED.</p>
<script src="core.js"></script>
<script src="scope-view.js"></script>
<script src="scope-win.js"></script>
</body>
</html>
