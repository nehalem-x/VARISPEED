<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#000000" />
<title>VARISPEED — Inicializando</title>
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="stylesheet" href="/startup.css" />
</head>
<body data-state="loading">
<main class="boot" aria-labelledby="bootTitle">
  <section class="boot__panel">
    <header class="boot__head">
      <img class="boot__icon" src="/assets/favicon.png" width="56" height="56" alt="" draggable="false" />
      <div>
        <h1 id="bootTitle">VARISPEED <span>1.0</span></h1>
      </div>
    </header>

    <div class="boot__status" role="status" aria-live="polite" aria-atomic="true">
      <strong id="stage">INICIALIZANDO...</strong>
    </div>

    <div class="boot__track" id="progressTrack" aria-hidden="true">
      <span></span>
    </div>

    <p class="boot__error" id="errorMessage" hidden></p>

    <div class="boot__actions" id="actions" hidden>
      <button id="retry" type="button">TENTAR NOVAMENTE</button>
      <button id="detailsToggle" type="button" aria-expanded="false" aria-controls="details">VER DETALHES</button>
    </div>

    <pre class="details mono" id="details" role="log" hidden aria-label="Log técnico da inicialização"></pre>
  </section>
</main>
<script src="/motion.js"></script>
<script src="/startup.js"></script>
</body>
</html>
