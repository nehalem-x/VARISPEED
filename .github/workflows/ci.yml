name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements-dev.txt

      - name: Lint Python sources
        run: python -m ruff check launcher.py server tests

      - name: Compile Python sources
        run: >-
          python -m py_compile
          launcher.py
          server/main.py
          server/browser_auth.py
          server/dedicated_auth.py
          server/youtube_pot.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit Python dependencies
        if: matrix.python-version == '3.13'
        run: python -m pip_audit -r server/requirements.txt

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in app.js core.js graph-engine.js library.js motion.js remote-import.js scope-view.js scope-win.js settings.js startup.js theme-boot.js; do
            node --check "$file"
          done

      - name: Run JavaScript tests
        run: node --test tests/*.test.js

      - name: Validate HTML
        run: npx --yes html-validate@10.4.0 index.html startup.html scope.html

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Reject secrets and generated artifacts
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -Ei '(^|/)(\.env($|\.)|[^/]*cookies[^/]*\.txt$|[^/]*\.(pem|key)$|\.venv/|__pycache__/|logs/)|\.pyc$|\.zip$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden tracked files:"
            echo "$forbidden"
            exit 1
          fi

          if git ls-files --error-unmatch GraphEngine.txt >/dev/null 2>&1; then
            echo "GraphEngine.txt is a local prototype and must not be tracked."
            exit 1
          fi
